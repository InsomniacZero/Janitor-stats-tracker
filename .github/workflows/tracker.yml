name: JStats 24/7 Cloud Tracker

on:
  schedule:
    # Runs every 10 minutes, 24/7/365 (100% free on public GitHub repos)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from GitHub Actions UI

concurrency:
  group: jstats-tracker-worker
  cancel-in-progress: true

jobs:
  track:
    name: Run Autonomous Tracker Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Execute Autonomous Cloud Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vclvynlyfylnjcjvyrfy.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_zQ5xfP0Ok8sV6tCVAqLQbQ_EWpAOs7G' }}
          JANITOR_COOKIE: ${{ secrets.JANITOR_COOKIE }}
          MAX_CYCLES: 1
          CYCLE_DELAY_MS: 5000
        run: node scripts/cloud-worker.js

