name: Test Scrape

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run Test Scrape
        env:
          JANITOR_COOKIE: ${{ secrets.JANITOR_COOKIE }}
        run: |
          node -e '
          import("playwright").then(async ({ chromium }) => {
            const rawCookie = process.env.JANITOR_COOKIE || "";
            const browser = await chromium.launch({
              headless: true,
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-blink-features=AutomationControlled"
              ]
            });
            const context = await browser.newContext({
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
              locale: "en-US",
              extraHTTPHeaders: {
                "Accept-Language": "en-US,en;q=0.9",
                "sec-ch-ua": "\"Chromium\";v=\"128\", \"Not;A=Brand\";v=\"24\", \"Google Chrome\";v=\"128\"",
                "sec-ch-ua-mobile": "?0",
                "sec-ch-ua-platform": "\"Windows\""
              }
            });
            await context.addInitScript(() => {
              Object.defineProperty(navigator, "webdriver", { get: () => undefined });
              window.chrome = { runtime: {} };
            });

            if (rawCookie) {
              const cookiesToAdd = [];
              for (const part of rawCookie.split(";")) {
                const [k, ...v] = part.trim().split("=");
                if (k && v.length) {
                  cookiesToAdd.push({ name: k, value: v.join("="), domain: ".janitorai.com", path: "/" });
                }
              }
              await context.addCookies(cookiesToAdd);

              const m0 = rawCookie.match(/sb-auth-auth-token\.0=([^;]+)/);
              const m1 = rawCookie.match(/sb-auth-auth-token\.1=([^;]+)/);
              if (m0 && m1) {
                try {
                  const combined = (m0[1] + m1[1]).replace(/^base64-/, "");
                  const decoded = Buffer.from(combined, "base64").toString("utf8");
                  await context.addInitScript((sStr) => {
                    try {
                      window.localStorage.setItem("sb-auth-auth-token", sStr);
                      window.localStorage.setItem("sb-mcmzxtzhmmmpnyhreddbo-auth-token", sStr);
                    } catch {}
                  }, decoded);
                } catch {}
              }
            }

            const page = await context.newPage();
            page.on("response", async (res) => {
              const u = res.url();
              if (u.includes("/characters") || u.includes("/hampter/")) {
                console.log(`[API ${res.status()}] ${u.substring(0, 100)}`);
                try {
                  const text = await res.text();
                  if (text.startsWith("{") || text.startsWith("[")) {
                    console.log("-> JSON length:", text.length, "Preview:", text.substring(0, 150));
                  }
                } catch {}
              }
            });

            console.log("Navigating to https://janitorai.com/?segment=following ...");
            const resp = await page.goto("https://janitorai.com/?segment=following", { waitUntil: "domcontentloaded", timeout: 25000 });
            await page.waitForTimeout(6000);

            console.log("HTTP Status:", resp.status());
            console.log("Title:", await page.title());
            const text = await page.evaluate(() => document.body.innerText);
            console.log("Body preview:", text.substring(0, 300).replace(/\n+/g, " "));

            await browser.close();
          });
          '
