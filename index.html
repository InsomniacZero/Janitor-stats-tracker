<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JStats</title>
  <meta name="description" content="Private, local statistics and character analytics for JanitorAI.">
  <link rel="icon" type="image/webp" href="./logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-bar">
      <div class="app-bar-inner">
        <div class="brand">
          <img src="./logo.webp" alt="JStats" class="brand-logo">
          <span class="brand-title">JStats</span>
        </div>
        <div class="actions">
          <button class="btn btn-secondary" id="exportBtn" title="Export character history as CSV">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            Export CSV
          </button>
          <button class="btn btn-primary" id="collectBtn" title="Collect stats from active JanitorAI tab or log snapshot">
            <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Collect Now
          </button>
          <button class="btn btn-danger" id="clearBtn" title="Delete stored character history">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Clear
          </button>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="hero">
        <div class="hero-content">
          <h1 id="title">JanitorAI Character</h1>
          <p id="subtitle">Waiting for character snapshot data.</p>
          <div class="meta" id="meta"></div>
        </div>
        <div class="hero-selector">
          <div class="selector-header">
            <span class="selector-label">Active Character</span>
            <div class="selector-quick-actions">
              <button type="button" class="btn-micro" id="addBtn" title="Record character snapshot manually">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                <span>Entry</span>
              </button>
              <button type="button" class="btn-micro" id="importBtn" title="Import CSV">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 5v12"/></svg>
                <span>Import</span>
              </button>
            </div>
          </div>

          <!-- Ink2Obsidian-style Custom Select -->
          <div class="custom-select-wrap" id="characterCustomSelect">
            <button type="button" class="custom-select-trigger" id="charSelectTrigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="custom-select-label" id="charSelectCurrent">Select a character...</span>
              <svg class="custom-select-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="custom-select-menu" id="charSelectMenu" role="listbox" style="display: none;"></div>
          </div>

          <!-- Hidden native select for accessibility/tests -->
          <select class="select" id="characterSelect" aria-label="Tracked character" style="display: none;"></select>
        </div>
      </div>

      <div class="notice" id="notice" style="display: none;"></div>

      <div class="toolbar">
        <div class="range-label">Growth Window</div>
        <div class="range-buttons" id="rangeControls"></div>
      </div>

      <section class="cards" id="cards"></section>
      <section class="insights" id="insights"></section>
      <section class="grid" id="charts"></section>

      <div class="footer-note" id="footer"></div>
    </main>
  </div>

  <!-- Hidden File Input for CSV Import -->
  <input type="file" id="csvFileInput" accept=".csv,text/csv" style="display: none;">

  <!-- Manual Entry Modal -->
  <div class="modal-overlay" id="entryModalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Record Character Snapshot</h3>
        <button class="modal-close" id="closeModalBtn" aria-label="Close modal">&times;</button>
      </div>
      <form id="entryForm" class="modal-form">
        <div class="form-row">
          <div class="form-group">
            <label for="manualName">Character Name</label>
            <input type="text" id="manualName" placeholder="e.g. Nyx Cybersmith" required>
          </div>
          <div class="form-group">
            <label for="manualId">Character ID / Slug</label>
            <input type="text" id="manualId" placeholder="Optional slug or UUID">
          </div>
        </div>
        <div class="form-row form-grid-4">
          <div class="form-group">
            <label for="manualMsgs">Messages</label>
            <div class="number-input-wrap">
              <input type="number" id="manualMsgs" placeholder="52000" min="0" required>
              <div class="stepper-controls">
                <button type="button" class="stepper-btn stepper-up" data-target="manualMsgs" aria-label="Increase messages">
                  <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
                </button>
                <button type="button" class="stepper-btn stepper-down" data-target="manualMsgs" aria-label="Decrease messages">
                  <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="manualChats">Chats</label>
            <div class="number-input-wrap">
              <input type="number" id="manualChats" placeholder="1800" min="0" required>
              <div class="stepper-controls">
                <button type="button" class="stepper-btn stepper-up" data-target="manualChats" aria-label="Increase chats">
                  <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
                </button>
                <button type="button" class="stepper-btn stepper-down" data-target="manualChats" aria-label="Decrease chats">
                  <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="manualComments">Comments</label>
            <div class="number-input-wrap">
              <input type="number" id="manualComments" placeholder="240" min="0" required>
              <div class="stepper-controls">
                <button type="button" class="stepper-btn stepper-up" data-target="manualComments" aria-label="Increase comments">
                  <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
                </button>
                <button type="button" class="stepper-btn stepper-down" data-target="manualComments" aria-label="Decrease comments">
                  <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="manualFavourites">Favourites</label>
            <div class="number-input-wrap">
              <input type="number" id="manualFavourites" placeholder="750" min="0" required>
              <div class="stepper-controls">
                <button type="button" class="stepper-btn stepper-up" data-target="manualFavourites" aria-label="Increase favourites">
                  <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
                </button>
                <button type="button" class="stepper-btn stepper-down" data-target="manualFavourites" aria-label="Decrease favourites">
                  <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="manualPublishedChats">Published Chats (optional)</label>
          <div class="number-input-wrap">
            <input type="number" id="manualPublishedChats" placeholder="1200" min="0">
            <div class="stepper-controls">
              <button type="button" class="stepper-btn stepper-up" data-target="manualPublishedChats" aria-label="Increase published chats">
                <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
              </button>
              <button type="button" class="stepper-btn stepper-down" data-target="manualPublishedChats" aria-label="Decrease published chats">
                <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Snapshot</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./dashboard.js"></script>
</body>
</html>
